<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Routes and stops')}"></head><body class="app-shell"><div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div><main class="app-main"><div th:replace="~{fragments/topbar :: topbar('Routes & stops')}"></div><section class="dashboard-content"><div th:replace="~{fragments/alerts :: alerts}"></div><div class="content-grid"><section class="panel form-panel"><h2 th:text="${form.id != null ? 'Edit route' : 'Create a route'}">Create a route</h2><p class="section-note">Enter one stop per line in route order. Format: stop name | minutes from previous stop. Use 0 for the first stop.</p><form th:action="@{/admin/routes/save}" th:object="${form}" method="post" class="stack-form"><div class="alert alert-error" th:if="${#fields.hasErrors('*')}" th:each="err : ${#fields.allErrors()}" th:text="${err}"></div><input type="hidden" th:field="*{id}"><label>Route code<input th:field="*{code}" required maxlength="24" placeholder="NORTH-01"></label><label>Route name<input th:field="*{name}" required maxlength="100" placeholder="North Campus Loop"></label><label>Ordered stops<textarea th:field="*{stopLines}" required placeholder="Maple Street | 0&#10;Central Library | 8&#10;North Gate | 12"></textarea></label><div class="tool-row"><button class="button button-primary" type="submit">Save route</button><a class="button button-outline" th:if="${form.id != null}" th:href="@{/admin/routes}">Cancel edit</a></div></form></section><section class="panel"><div class="panel-title"><h2>Route planner</h2><span class="subtle">Estimated duration from stop timings</span></div><form class="toolbar" th:action="@{/admin/routes}" method="get"><input type="search" name="q" th:value="${q}" placeholder="Filter by route or stop"><button class="button button-primary button-small" type="submit">Filter routes</button><a class="button button-outline button-small" th:href="@{/admin/routes}">Clear</a></form><article class="route-card" style="margin-bottom:12px" th:each="route : ${routes}"><div class="route-card-top"><span class="route-code" th:text="${route.code}">ROUTE</span><span class="badge" th:classappend="${route.active ? ' badge-success' : ' badge-neutral'}" th:text="${route.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span><div class="status-actions"><a class="button button-outline button-xs" th:href="@{/admin/routes/{id}/edit(id=${route.id})}">Edit route</a><form th:if="${route.active}" th:action="@{/admin/routes/{id}/deactivate(id=${route.id})}" method="post"><button class="button button-danger button-xs" type="submit">Deactivate</button></form><form th:if="${!route.active}" th:action="@{/admin/routes/{id}/activate(id=${route.id})}" method="post"><button class="button button-primary button-xs" type="submit">Activate</button></form></div></div><h2 th:text="${route.name}">Route name</h2><div class="stop-list"><div class="stop-item" th:each="stop : ${route.stops}"><span class="stop-marker"></span><div><strong th:text="${stop.stopOrder + '. ' + stop.name}">Stop</strong><small th:text="${stop.travelMinutesFromPrevious + ' min from previous stop'}">0 min</small></div></div></div><p class="section-note" th:if="${#lists.isEmpty(route.stops)}">No stops configured.</p></article><div class="table-empty" th:if="${#lists.isEmpty(routes)}">No routes configured yet.</div></section></div></section></main></body></html>
