<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Transport updates')}"></head><body class="app-shell"><div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div><main class="app-main"><div th:replace="~{fragments/topbar :: topbar('Transport updates')}"></div><section class="dashboard-content"><div th:replace="~{fragments/alerts :: alerts}"></div><div class="content-grid"><section class="panel form-panel"><h2>Publish transport update</h2><form th:action="@{/admin/updates}" method="post" class="stack-form"><label>Update type<select name="type" required><option th:each="type : ${types}" th:value="${type}" th:text="${type}"></option></select></label><label>Message<textarea name="message" required maxlength="700" placeholder="Share the operational update clearly"></textarea></label><label>Related bus (optional)<select name="busId"><option value="">No specific bus</option><option th:each="bus : ${buses}" th:value="${bus.id}" th:text="${bus.busNumber}"></option></select></label><label>Related route (optional)<select name="routeId"><option value="">No specific route</option><option th:each="route : ${routes}" th:value="${route.id}" th:text="${route.name}"></option></select></label><button class="button button-primary" type="submit">Publish update</button></form></section><section class="panel"><div class="panel-title"><h2>Latest notices</h2><span class="subtle">Newest first</span></div><div class="list-stack"><article class="update-item" th:each="update : ${updates}"><span class="update-type-icon" th:text="${update.type.name() == 'BREAKDOWN' ? '!' : '◉'}">◉</span><div class="update-copy"><strong th:text="${update.type}">NOTICE</strong><p th:text="${update.message}">Message</p><small><span th:if="${update.bus != null}" th:text="${update.bus.busNumber + ' · '}"></span><span th:if="${update.route != null}" th:text="${update.route.name + ' · '}"></span><span th:text="${#temporals.format(update.createdAt, 'MMM d, yyyy · HH:mm')}">date</span></small></div></article><div class="table-empty" th:if="${#lists.isEmpty(updates)}">No announcements yet.</div></div></section></div></section></main></body></html>
