<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Event transport planning')}"></head><body class="app-shell"><div th:replace="~{fragments/admin-sidebar :: adminSidebar}"></div><main class="app-main"><div th:replace="~{fragments/topbar :: topbar('Event transport planning')}"></div><section class="dashboard-content"><div th:replace="~{fragments/alerts :: alerts}"></div><div class="content-grid"><section class="panel form-panel"><h2>Plan event transport</h2><p class="section-note">Estimate uses 40 passenger seats per bus.</p><form th:action="@{/admin/events}" method="post" class="stack-form"><label>Event name<input name="name" required maxlength="140"></label><label>Event date<input type="date" name="eventDate" required></label><label>Expected attendees<input type="number" name="expectedAttendees" min="1" required></label><label>Planning notes<textarea name="notes" maxlength="500"></textarea></label><button class="button button-primary" type="submit">Save event plan</button></form></section><section class="panel"><div class="panel-title"><h2>Upcoming plans</h2><span class="subtle" th:text="${events.size() + ' events'}">0 events</span></div><div class="list-stack"><article class="update-item" th:each="event : ${events}"><span class="update-type-icon">▤</span><div class="update-copy"><strong th:text="${event.name}">Event</strong><p><span th:text="${#temporals.format(event.eventDate, 'EEE, MMM d, yyyy')}">Date</span> · <span th:text="${event.expectedAttendees + ' expected attendees'}">Attendees</span></p><small th:text="${event.busesRequired + ' buses estimated · up to 40 seats each'}">2 buses</small><p th:if="${event.notes != null and !event.notes.isBlank()}" th:text="${event.notes}"></p></div><form th:action="@{/admin/events/{id}/delete(id=${event.id})}" method="post"><button class="button button-danger button-xs" type="submit">Remove</button></form></article><div class="table-empty" th:if="${#lists.isEmpty(events)}">No event transport plans yet.</div></div></section></div></section></main></body></html>
